name: Ingest News

on:
  schedule:
    - cron: '20 */2 * * *'
  workflow_dispatch:
    inputs:
      all_sources:
        description: 'Force GNews and MediaStack for this manual run (ignores quota gating)'
        type: boolean
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run ingest
        run: npx tsx scripts/ingest.ts
        env:
          INGEST_ALL_SOURCES: ${{ inputs.all_sources && '1' || '' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          MEDIASTACK_API_KEY: ${{ secrets.MEDIASTACK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
