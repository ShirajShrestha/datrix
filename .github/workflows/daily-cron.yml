name: Daily News Cron

on:
  schedule:
    # Run at 6:00 AM UTC daily
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel News Cron
        run: |
          curl -X GET "https://datrix-mu.vercel.app/api/cron/news" \
            -H "Authorization: Bearer newsintel_cron_2024"

  fetch-digest:
    runs-on: ubuntu-latest
    needs: fetch-news
    steps:
      - name: Call Vercel Digest Cron
        run: |
          curl -X GET "https://datrix-mu.vercel.app/api/cron/digest" \
            -H "Authorization: Bearer newsintel_cron_2024"
